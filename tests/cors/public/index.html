<!doctype html><meta charset="utf-8"><pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const api = "http://127.0.0.1:" + q.get("api"), other = "http://127.0.0.1:" + q.get("other");
const say = s => { document.getElementById("out").textContent += s + "\n"; };
(async () => {
  say("get " + await fetch(api + "/items").then(r => r.status + " " + r.headers.get("x-seen")).catch(e => "blocked"));
  say("post " + await fetch(api + "/items", {method: "POST", headers: {"Content-Type": "application/json", "Authorization": "Bearer t"}, body: "[1]", credentials: "include"}).then(r => r.text()).catch(e => "blocked"));
  say("other " + await fetch(other + "/items", {method: "POST", headers: {"Content-Type": "application/json"}, body: "[2]"}).then(r => r.status).catch(e => "blocked"));
  say("done");
})();
</script>
