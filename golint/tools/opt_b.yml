version: "2"
linters:
  default: none
  enable: [copyloopvar, dogsled, gocyclo, misspell, nakedret, predeclared, whitespace]
  settings:
    gocyclo:
      min-complexity: 20
    dogsled:
      max-blank-identifiers: 1
    nakedret:
      max-func-lines: 5
    predeclared:
      qualified-name: true
    whitespace:
      multi-if: true
      multi-func: true
    misspell:
      locale: US
    copyloopvar:
      check-alias: true
