# vgolint in GitHub Actions, in place of golangci/golangci-lint-action, with its common inputs:
#
#   - uses: actions/setup-go@v6
#     with:
#       go-version: stable
#   - uses: vu0tran/vu/golint/action@main      # (or a vgolint-vX.Y.Z tag)
#     with:
#       version: v0.1.0                        # a vgolint release (default: the latest)
#       args: --timeout=5m
#
# It downloads the release for the runner (Linux or macOS, x86-64 or ARM64), checks it against the
# release's SHA256SUMS, puts vgolint and golangci-lint (a link to it) on PATH, downloads the modules
# (vgolint reads the module cache but never downloads), and runs `vgolint run` with the arguments.
name: vgolint
description: Run vgolint (golangci-lint written in Vu) with golangci-lint-action's common inputs
author: vu0tran
branding:
  icon: check-circle
  color: blue
inputs:
  version:
    description: "The vgolint release: v0.1.0, vgolint-v0.1.0 or latest"
    required: false
    default: latest
  args:
    description: "Arguments for `vgolint run` (golangci-lint run's flags), e.g. --timeout=5m ./..."
    required: false
    default: ""
  working-directory:
    description: The folder to run in (the module's root)
    required: false
    default: ""
  only-new-issues:
    description: "Report only issues in the pull request's (or push's) changes"
    required: false
    default: "false"
  install-only:
    description: Install vgolint (and golangci-lint, a link to it) on PATH without running it
    required: false
    default: "false"
  problem-matchers:
    description: Show the issues as annotations, through a problem matcher for the text format
    required: false
    default: "false"
  go-mod-download:
    description: "Run `go mod download` first (vgolint never downloads modules itself)"
    required: false
    default: "true"
  github-token:
    description: The token for the GitHub API (the latest release, the pull request's diff)
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Install vgolint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        case "$RUNNER_OS" in Linux | macOS) ;; *) echo "::error::vgolint has releases for Linux and macOS only"; exit 1 ;; esac
        bin="$RUNNER_TEMP/vgolint-bin"
        sh "$GITHUB_ACTION_PATH/../install.sh" -b "$bin" -f "$VERSION"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/vgolint" version
    - name: Download the modules
      if: inputs.install-only != 'true' && inputs.go-mod-download == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      run: |
        command -v go >/dev/null || { echo "::error::vgolint reads the Go standard library's source: install Go first (actions/setup-go)"; exit 1; }
        if [ -f go.mod ]; then go mod download; fi
    - name: Run vgolint
      if: inputs.install-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        ARGS: ${{ inputs.args }}
        ONLY_NEW: ${{ inputs.only-new-issues }}
        MATCHERS: ${{ inputs.problem-matchers }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.event.after }}
      run: |
        extra=()
        if [ "$ONLY_NEW" = true ]; then
          # the change as a patch from the API (no git history needed), as golangci-lint-action does
          patch="$RUNNER_TEMP/vgolint.patch"
          url=""
          case "$EVENT" in
            pull_request | pull_request_target) url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR" ;;
            push) [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" ;;
          esac
          if [ -n "$url" ] && curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3.diff" -o "$patch" "$url"; then
            extra+=("--new-from-patch=$patch")
          else
            echo "::warning::only-new-issues: no diff for this $EVENT event; reporting every issue"
          fi
        fi
        if [ "$MATCHERS" = true ]; then
          echo "::add-matcher::$GITHUB_ACTION_PATH/matcher.json"
        fi
        # (word splitting as golangci-lint-action splits args)
        # shellcheck disable=SC2086
        vgolint run "${extra[@]}" $ARGS
