# Fly.io: `fly launch --copy-config --no-deploy` once (it may pick another app name: names are global),
# then `fly deploy`. The Dockerfile builds the app; Fly gives it HTTPS.
app = "@@NAME@@"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
