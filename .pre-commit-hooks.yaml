# pre-commit hooks (https://pre-commit.com) for vsc, ShellCheck written in Vu. They run the vsc
# installed on the machine (language: system): install it first (shellcheck/README.md, Install).
#
#   - repo: https://github.com/vu0tran/vu
#     rev: vsc-v0.1.0
#     hooks:
#       - id: shellcheck     # the id shellcheck-py/shellcheck-py and koalaman/shellcheck-precommit use (or: vsc)
#
# A hook that installs a pinned vsc by itself (pre-commit's node environment, from npm), with
# nothing installed beforehand, goes in the project's own config instead:
#
#   - repo: local
#     hooks:
#       - id: shellcheck
#         name: shellcheck (vsc)
#         language: node
#         additional_dependencies: ['@vu0tran/vsc@0.1.0']
#         entry: shellcheck
#         types: [shell]
- id: vsc
  name: shellcheck (vsc)
  description: ShellCheck 0.11.0's checks, by vsc (ShellCheck written in Vu); needs vsc on PATH
  entry: vsc
  language: system
  types: [shell]
- id: shellcheck
  name: shellcheck (vsc)
  description: ShellCheck 0.11.0's checks, by vsc (ShellCheck written in Vu); needs vsc on PATH
  entry: vsc
  language: system
  types: [shell]
