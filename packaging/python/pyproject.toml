[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy"
version = "0.1.0"
description = "Edit distance, written in Vu"
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["fuzzy"]

[tool.setuptools.package-data]
fuzzy = ["fuzzy.vu"]
