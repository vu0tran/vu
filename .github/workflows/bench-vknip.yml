# vknip's speed on more cores than a development machine may have: builds vknip at the given commits
# and times it on a generated monorepo (knip/test/genmono.py: 100 packages of 300 files, 400 packages
# in node_modules, JavaScript configs loaded with Node.js, one of them slow) on 4-core Linux runners
# and a 3-core macOS one. Nothing of anyone else's runs: the project is generated.
#   Actions, bench-vknip, Run workflow: cases, one per line, "COMMIT [VAR=VALUE...]"
#   (e.g. "main" and "main VKNIP_PRERESOLVE=0"); the times and phases are in the run's summary.
name: bench-vknip
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'One per line (or ";"): COMMIT [VAR=VALUE...]'
        required: true
        default: 'main;main VKNIP_PRERESOLVE=0'
      runs:
        description: 'Timed runs of each case (after one untimed)'
        required: false
        default: '5'
      gen:
        description: 'genmono.py arguments: NPKG NFILES SLOW_MS'
        required: false
        default: '100 300 1000'
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build each commit
        env:
          CASES: ${{ inputs.cases }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' "$CASES" | tr ';' '\n' | awk 'NF {print $1}' | sort -u | while read -r c; do
            sha=$(git rev-parse --short "$c")
            [ -x "$RUNNER_TEMP/bin/vknip-$sha" ] && continue
            git worktree add -q "$RUNNER_TEMP/wt-$sha" "$sha"
            (cd "$RUNNER_TEMP/wt-$sha" && ./vu build --release knip/vknip.vu -o "$RUNNER_TEMP/bin/vknip-$sha")
          done
          ls -l "$RUNNER_TEMP/bin"
      - name: Generate the project
        env:
          GEN: ${{ inputs.gen }}
        run: |
          # shellcheck disable=SC2086
          python3 knip/test/genmono.py "$RUNNER_TEMP/gm" $GEN
          find "$RUNNER_TEMP/gm" -type f | wc -l
      - name: Time each case
        env:
          CASES: ${{ inputs.cases }}
          RUNS: ${{ inputs.runs }}
        run: |
          cd "$RUNNER_TEMP/gm"
          cores=$(getconf _NPROCESSORS_ONLN)
          { echo "### ${{ matrix.os }} ($cores cores)"; echo; echo '| case | wall (s), each run | phases of the last run |'; echo '|---|---|---|'; } >> "$GITHUB_STEP_SUMMARY"
          ref=""
          printf '%s\n' "$CASES" | tr ';' '\n' | while read -r line; do
            [ -n "$line" ] || continue
            # shellcheck disable=SC2086
            set -- $line
            sha=$(git -C "$GITHUB_WORKSPACE" rev-parse --short "$1"); shift
            bin="$RUNNER_TEMP/bin/vknip-$sha"
            env "$@" "$bin" --no-progress > out.txt 2>&1 || true
            [ -n "$ref" ] || { cp out.txt ref.txt; ref=1; }
            same=same; cmp -s out.txt ref.txt || same="**output differs from the first case**"
            walls=""
            for _ in $(seq 1 "$RUNS"); do
              s=$(python3 -c 'import time; print(time.time())')
              env "$@" VKNIP_PHASES=1 "$bin" --no-progress > /dev/null 2> phases.txt || true
              e=$(python3 -c 'import time; print(time.time())')
              walls="$walls $(python3 -c "print(f'{$e - $s:.2f}')")"
            done
            ph=$(python3 - phases.txt <<'EOF'
          import sys
          rows = [l.split(None, 2) for l in open(sys.argv[1]) if l.startswith("PHASE")]
          out, prev = [], None
          for _, t, n in rows:
              t = float(t)
              if prev and t - prev[0] >= 0.05: out.append(f"{prev[1]}→{n.strip()} {t - prev[0]:.2f}")
              prev = (t, n.strip())
          print("; ".join(out))
          EOF
            )
            echo "| $sha $* ($same) |$walls | $ph |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"
