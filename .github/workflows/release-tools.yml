# Releases of the drop-in tools, separate from Vu's own (release.yml, v* tags):
#   vlint-vX.Y.Z    vlint (oxlint):          GitHub release archives + npm (@vu0tran/vlint and its platform packages)
#   vgolint-vX.Y.Z  vgolint (golangci-lint): GitHub release archives named as golangci-lint's, for golint/install.sh
#                   and the golint/action composite action, plus a Homebrew formula file
#   vsc-vX.Y.Z      vsc (ShellCheck):        GitHub release archives named as ShellCheck's (vsc and shellcheck),
#                   install.sh, npm (@vu0tran/vsc: vsc and shellcheck); shellcheck/action, .pre-commit-hooks.yaml
#   vjq-vX.Y.Z      vjq (jq):                GitHub release binaries named as jq's (jq-linux-amd64, ...) and archives
#                   (vjq and jq), install.sh, npm (@vu0tran/vjq: vjq and jq); jq/action
#   vknip-vX.Y.Z    vknip (knip):            GitHub release archives (vknip and knip), install.sh, npm
#                   (@vu0tran/vknip: vknip and knip, so "knip": "npm:@vu0tran/vknip@^X" works)
# Each tool is built on each platform's own runner (packaging/tools/build.sh: a portable -march, Linux
# binaries static, macOS 12 or later, stripped), smoke-tested there against the original tool's saved
# output (packaging/tools/smoke.sh), and summed in SHA256SUMS. The tool releases are never marked
# "latest", so github.com/vu0tran/vu/releases/latest stays Vu's (install.sh relies on it).
#
# Actions, release-tools, Run workflow: with no tag, a dry run that builds, smoke-tests and packs
# everything (npm tarballs included, installed and run in a scratch project) and uploads it as the
# run's artifacts, publishing nothing; with a tag that exists (TOOL-vX.Y.Z), that release again (what
# is already published is skipped). npm versions are staged and go live when approved with 2FA (RELEASING.md).
name: release-tools
on:
  push:
    tags: ['vlint-v*', 'vgolint-v*', 'vsc-v*', 'vjq-v*', 'vknip-v*']
  workflow_dispatch:
    inputs:
      tool:
        description: 'Dry run: which tool to build'
        type: choice
        options: [all, vlint, vgolint, vsc, vjq, vknip]
        default: all
      tag:
        description: 'A tag to release (again), e.g. vsc-v0.1.0; empty: a dry run that publishes nothing'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release-tools-${{ inputs.tag || github.ref }}
env:
  NPM_SCOPE: '@vu0tran'     # the npm scope of the tools' packages (make.mjs --scope)
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tools: ${{ steps.p.outputs.tools }}
      npm_tools: ${{ steps.p.outputs.npm_tools }}
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - id: p
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_TOOL: ${{ inputs.tool }}
        run: |
          all="vlint vgolint vsc vjq vknip"
          tag="$IN_TAG"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -n "$tag" ]; then
            tool="${tag%%-v*}"; version="${tag#*-v}"
            case " $all " in *" $tool "*) ;; *) echo "::error::$tag isn't a tag of a tool ($all: TOOL-vX.Y.Z)"; exit 1 ;; esac
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::$version (from $tag) isn't a semver version"; exit 1; }
            tools="$tool"; publish=true
          else
            case "$IN_TOOL" in all | "") tools="$all" ;; *) tools="$IN_TOOL" ;; esac
            version="0.0.0-dev.$GITHUB_RUN_NUMBER"; publish=false
          fi
          # as JSON lists; the tools with npm packages (all but vgolint)
          json() { printf '['; sep=""; for t in "$@"; do printf '%s"%s"' "$sep" "$t"; sep=","; done; printf ']'; }
          # shellcheck disable=SC2086
          tools_json=$(json $tools)
          # shellcheck disable=SC2086,SC2046
          npm_json=$(json $(printf '%s\n' $tools | grep -vx vgolint))
          { echo "tools=$tools_json"; echo "npm_tools=$npm_json"; echo "version=$version"; echo "tag=$tag"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"
          echo "tools $tools_json (npm: $npm_json), version $version, tag '${tag}', publish $publish"

  build:
    needs: plan
    name: ${{ matrix.tool }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
        platform: [linux-x64, linux-arm64, darwin-arm64, darwin-x64]
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: darwin-arm64
            os: macos-15
          - platform: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      TOOL: ${{ matrix.tool }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag || github.ref }}
      # vgolint's smoke test reads the standard library's source, as golangci-lint does
      - uses: actions/setup-go@v6
        if: matrix.tool == 'vgolint'
        with:
          go-version: stable
          cache: false
      # vknip loads the fixture's knip.config.ts in node, as knip does
      - uses: actions/setup-node@v5
        if: matrix.tool == 'vknip'
        with:
          node-version: 22
      - name: Build
        run: sh packaging/tools/build.sh "$TOOL" "$VERSION" "$PLATFORM"
      - name: Smoke test (the archive unpacked elsewhere, on a fixture, against the original's output)
        run: |
          mkdir -p "$RUNNER_TEMP/u"
          for a in dist/*.tar.gz dist/*.tar.xz; do
            if [ -f "$a" ]; then tar xf "$a" -C "$RUNNER_TEMP/u"; fi
          done
          d=$(ls -d "$RUNNER_TEMP"/u/*/)
          ls -l "$d"
          sh packaging/tools/smoke.sh "$TOOL" "$d$TOOL"
          # vjq's bare binary, named as jq's release assets
          for b in dist/jq-*; do
            if [ -f "$b" ]; then chmod +x "$b"; sh packaging/tools/smoke.sh vjq "$b"; fi
          done
      - name: Smoke test on musl (Alpine), the static binary as it is
        if: runner.os == 'Linux' && matrix.tool != 'vgolint'
        run: |
          d=$(ls -d "$RUNNER_TEMP"/u/*/)
          image=alpine:3.22
          if [ "$TOOL" = vknip ]; then image=node:22-alpine; fi
          docker run --rm -v "$PWD/packaging/tools":/t:ro -v "$d":/b:ro "$image" sh /t/smoke.sh "$TOOL" "/b/$TOOL"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.tool }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/jq-*
            dist/sums-*.txt
          if-no-files-found: error

  # the npm packages: made and checked on every run, published for a tag of a tool that has them
  npm:
    needs: [plan, build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result != 'failure' && needs.plan.outputs.npm_tools != '[]' }}
    name: npm ${{ matrix.tool }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.npm_tools) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write    # npm provenance and trusted publishing
    outputs:
      staged: ${{ steps.publish.outputs.staged }}
    env:
      TOOL: ${{ matrix.tool }}
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.15 or later (npm stage publish; trusted publishing through GitHub's OIDC token)
        run: npm install -g npm@^11.15.0 && npm --version
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ matrix.tool }}-*
          merge-multiple: true
          path: dist
      - name: Make the packages
        run: node packaging/npm/make.mjs --tool "$TOOL" --version "$VERSION" --dist dist --out npm --scope "$NPM_SCOPE"
      - name: Pack them, install the tarballs in a scratch project, run the commands on the fixture
        run: |
          mkdir -p tarballs
          for d in npm/"$TOOL"-* npm/"$TOOL"; do (cd "$d" && npm pack --pack-destination ../../tarballs); done
          ls -l tarballs
          p="$RUNNER_TEMP/proj"; mkdir -p "$p"
          cd "$p"
          npm init -y >/dev/null
          # the platform package from its tarball (the registry doesn't have this version yet), then the
          # main one; the original's name for the main one (as users switch: "knip": "npm:@vu0tran/vknip@^X")
          case "$TOOL" in vlint) orig=oxlint ;; vsc) orig=shellcheck ;; vjq) orig=jq ;; vknip) orig=knip ;; esac
          main=$(ls "$GITHUB_WORKSPACE"/tarballs/*"$TOOL"-[0-9]*.tgz)
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/tarballs/*"$TOOL"-linux-x64-*.tgz "$orig@file:$main"
          ls -l node_modules/.bin
          if [ "$TOOL" = vlint ]; then
            cp -R "$GITHUB_WORKSPACE"/packaging/tools/fixtures/vlint/. .
            AI_AGENT=1 npx --no-install oxlint a.ts b.jsx | sort | diff "$GITHUB_WORKSPACE/packaging/tools/fixtures/vlint.expected" -
            AI_AGENT=1 npx --no-install vlint a.ts b.jsx | sort | diff "$GITHUB_WORKSPACE/packaging/tools/fixtures/vlint.expected" -
            npx --no-install vlint --version
          else
            # (the fixture is copied outside this project: vknip then loads its config with the
            # package's own jiti, as in a project without one)
            sh "$GITHUB_WORKSPACE/packaging/tools/smoke.sh" "$TOOL" "$p/node_modules/.bin/$orig"
            "$p/node_modules/.bin/$TOOL" --version
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: npm-tarballs-${{ matrix.tool }}
          path: tarballs/*.tgz
      - name: Stage for publishing (the platform packages first, then the main one); a dry run only checks
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG_NAME: ${{ needs.plan.outputs.tag }}
        run: |
          # (a prerelease, 0.2.0-rc.1, goes out under the dist-tag next, so latest stays the last release)
          tag=latest; case "$VERSION" in *-*) tag=next ;; esac
          if [ "$PUBLISH" != true ]; then
            for d in npm/"$TOOL"-* npm/"$TOOL"; do (cd "$d" && npm stage publish --dry-run --access public --tag "$tag"); done
            exit 0
          fi
          # Staged publishing (docs.npmjs.com/staged-publishing): each version is staged here, which needs
          # no 2FA, and goes live when a maintainer approves it with 2FA (npmjs.com, Staged Packages, or
          # npm stage approve ID). Authentication: this workflow as the package's trusted publisher
          # when it has one, NPM_TOKEN otherwise.
          staged=false
          for d in npm/"$TOOL"-* npm/"$TOOL"; do
            name=$(node -p "require('./$d/package.json').name")
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then echo "$name@$VERSION is already published"; continue; fi
            staged=true
            (cd "$d" && npm stage publish --provenance --access public --tag "$tag") || {
              echo "::error::npm publish $name@$VERSION failed. A package that exists needs this workflow as its trusted publisher (npmjs.com, the package's settings: user vu0tran, repository vu, workflow release-tools.yml); a new one needs NPM_TOKEN with read and write on every package and \"Bypass 2FA\" (RELEASING.md); or publish the npm-tarballs-$TOOL artifact by hand (RELEASING.md, By hand)"
              exit 1
            }
          done
          echo "staged=$staged" >> "$GITHUB_OUTPUT"
          if [ "$staged" = true ]; then
            echo "::notice::$TOOL $VERSION is staged on npm: approve each package with 2FA (npmjs.com, Staged Packages, or npm stage list / npm stage approve ID), then run this workflow again with tag $TAG_NAME to check the installs from npm"
          fi

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      TOOL: ${{ fromJSON(needs.plan.outputs.tools)[0] }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ fromJSON(needs.plan.outputs.tools)[0] }}-*
          merge-multiple: true
          path: dist
      - name: Release
        run: |
          cd dist
          cat sums-*.txt > SHA256SUMS
          cat SHA256SUMS
          files="$(ls -- *.tar.gz *.tar.xz jq-* 2>/dev/null || true) SHA256SUMS"
          src="https://github.com/$GITHUB_REPOSITORY/tree/$TAG"
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main"
          case "$TOOL" in
            vlint)
              title="vlint $VERSION"
              cat > notes.md <<EOF
          vlint $VERSION: oxlint 1.90.0's default rules, written in Vu ([ts/README.md]($src/ts)).

          ## Install

          \`\`\`
          npm install --save-dev $NPM_SCOPE/vlint@$VERSION
          \`\`\`

          or in place of oxlint, keeping \`oxlint\` in your scripts: \`"oxlint": "npm:$NPM_SCOPE/vlint@$VERSION"\` in devDependencies.
          The archives hold the binary alone: Linux x64 and ARM64 (static: any glibc or musl), macOS 12 or later on Apple silicon and Intel. Check them against SHA256SUMS.
          EOF
              ;;
            vgolint)
              title="vgolint $VERSION"
              sh ../packaging/homebrew/vgolint_formula.sh "$VERSION" SHA256SUMS > vgolint.rb
              cp ../golint/install.sh install.sh
              files="$files vgolint.rb install.sh"
              cat > notes.md <<EOF
          vgolint $VERSION: \`golangci-lint run\` (2.5.0) written in Vu ([golint/README.md]($src/golint)). It needs Go where it runs, as golangci-lint does.

          ## Install

          \`\`\`
          curl -sSfL $raw/golint/install.sh | sh -s -- -b \$(go env GOPATH)/bin v$VERSION
          \`\`\`

          It installs \`vgolint\` and a \`golangci-lint\` link to it. In GitHub Actions: \`uses: $GITHUB_REPOSITORY/golint/action@$TAG\` (see golint/README.md). Archives for Linux amd64 and arm64 (static) and macOS 12 or later (arm64, amd64); check them against SHA256SUMS. vgolint.rb is a Homebrew formula for this release (not published).
          EOF
              ;;
            vsc)
              title="vsc $VERSION (ShellCheck 0.11.0)"
              cp ../packaging/tools/install.sh install.sh
              files="$files install.sh"
              cat > notes.md <<EOF
          vsc $VERSION: ShellCheck 0.11.0 written in Vu, the same checks and output byte for byte, about 25 times less CPU ([shellcheck/README.md]($src/shellcheck)).

          ## Install

          \`\`\`
          curl -fsSL $raw/packaging/tools/install.sh | sh -s -- vsc $VERSION      # vsc and shellcheck in ~/.local/bin (-b DIR)
          npm install --save-dev $NPM_SCOPE/vsc@$VERSION                          # or "shellcheck": "npm:$NPM_SCOPE/vsc@$VERSION"
          \`\`\`

          GitHub Actions, in place of ludeeus/action-shellcheck (same inputs): \`uses: $GITHUB_REPOSITORY/shellcheck/action@$TAG\`. pre-commit: \`repo: https://github.com/$GITHUB_REPOSITORY\`, \`rev: $TAG\`, hook \`shellcheck\` (needs vsc installed).
          The archives are named as ShellCheck's (\`vsc-v$VERSION.linux.x86_64.tar.xz\`, \`linux.aarch64\`, \`darwin.x86_64\`, \`darwin.aarch64\`) and hold \`vsc\` and \`shellcheck\` (a link to it): Linux binaries static (any glibc or musl), macOS 12 or later. Check them against SHA256SUMS.
          EOF
              ;;
            vjq)
              title="vjq $VERSION (jq 1.7.1)"
              cp ../packaging/tools/install.sh install.sh
              files="$files install.sh"
              cat > notes.md <<EOF
          vjq $VERSION: jq 1.7.1 written in Vu, the same language, output and messages ([jq/README.md]($src/jq)).

          ## Install

          \`\`\`
          curl -fsSL -o /usr/local/bin/jq https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/jq-linux-amd64 && chmod +x /usr/local/bin/jq
          curl -fsSL $raw/packaging/tools/install.sh | sh -s -- vjq $VERSION      # vjq and jq in ~/.local/bin (-b DIR)
          npm install --save-dev $NPM_SCOPE/vjq@$VERSION
          \`\`\`

          The bare binaries are named as jq's release assets: \`jq-linux-amd64\`, \`jq-linux-arm64\`, \`jq-macos-amd64\`, \`jq-macos-arm64\`; the archives \`vjq-$VERSION-OS-ARCH.tar.gz\` hold \`vjq\` and \`jq\` (a link to it). GitHub Actions: \`uses: $GITHUB_REPOSITORY/jq/action@$TAG\`. Linux binaries static (any glibc or musl), macOS 12 or later. The binaries don't load Oniguruma: the few regex constructs vjq leaves to it are an error (jq/README.md, Regular expressions). Check them against SHA256SUMS.
          EOF
              ;;
            vknip)
              title="vknip $VERSION (knip 6.44.1)"
              cp ../packaging/tools/install.sh install.sh
              files="$files install.sh"
              cat > notes.md <<EOF
          vknip $VERSION: knip 6.44.1 written in Vu, the same report byte for byte ([knip/README.md]($src/knip)).

          ## Install

          \`\`\`
          npm install --save-dev $NPM_SCOPE/vknip@$VERSION
          \`\`\`

          or in place of knip, keeping \`knip\` in your scripts: \`"knip": "npm:$NPM_SCOPE/vknip@$VERSION"\` in devDependencies. Node runs JavaScript and TypeScript configs, as for knip.
          The archives (\`vknip\` and \`knip\`, a link to it; \`install.sh vknip\`) are for machines without npm: TypeScript configs then load with the project's jiti or Node's own type stripping. Linux binaries static (any glibc or musl), macOS 12 or later. Check them against SHA256SUMS.
          EOF
              ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" --clobber $files
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --verify-tag --latest=false --title "$title" --notes-file notes.md $files
          fi

  # what a user does, against what was published: install.sh / npm from the registry, then the fixture
  check:
    needs: [plan, release, npm]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.release.result == 'success' && needs.npm.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      TOOL: ${{ fromJSON(needs.plan.outputs.tools)[0] }}
      GITHUB_TOKEN: ${{ github.token }}
      STAGED: ${{ needs.npm.outputs.staged }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-go@v6
        if: env.TOOL == 'vgolint'
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        if: env.TOOL != 'vgolint'
        with:
          node-version: 22
      - name: vgolint through install.sh
        if: env.TOOL == 'vgolint'
        run: |
          sh golint/install.sh -b "$RUNNER_TEMP/bin" "v$VERSION"
          test -L "$RUNNER_TEMP/bin/golangci-lint"
          sh packaging/tools/smoke.sh vgolint "$RUNNER_TEMP/bin/golangci-lint"
      - name: vlint from npm
        if: env.TOOL == 'vlint' && needs.npm.outputs.staged != 'true'
        run: |
          p="$RUNNER_TEMP/proj"; mkdir -p "$p"; cp -R packaging/tools/fixtures/vlint/. "$p/"
          cd "$p" && npm init -y >/dev/null
          # (the registry can take a minute to serve a new version)
          for _ in 1 2 3 4 5 6; do npm install --no-audit --no-fund "oxlint@npm:$NPM_SCOPE/vlint@$VERSION" && break; sleep 20; done
          AI_AGENT=1 npx --no-install oxlint a.ts b.jsx | sort | diff "$GITHUB_WORKSPACE/packaging/tools/fixtures/vlint.expected" -
      - name: ${{ env.TOOL }} through install.sh and from npm
        if: env.TOOL == 'vsc' || env.TOOL == 'vjq' || env.TOOL == 'vknip'
        run: |
          case "$TOOL" in vsc) orig=shellcheck ;; vjq) orig=jq ;; vknip) orig=knip ;; esac
          sh packaging/tools/install.sh "$TOOL" -b "$RUNNER_TEMP/bin" "$VERSION"
          test -L "$RUNNER_TEMP/bin/$orig"
          sh packaging/tools/smoke.sh "$TOOL" "$RUNNER_TEMP/bin/$orig"
          if [ "$TOOL" = vjq ]; then
            # the bare binary, as jq's own releases are downloaded
            case "$RUNNER_OS/$RUNNER_ARCH" in Linux/X64) a=linux-amd64 ;; Linux/ARM64) a=linux-arm64 ;; macOS/X64) a=macos-amd64 ;; macOS/ARM64) a=macos-arm64 ;; esac
            mkdir -p "$RUNNER_TEMP/bare"
            curl -fsSL -o "$RUNNER_TEMP/bare/jq" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/jq-$a"
            chmod +x "$RUNNER_TEMP/bare/jq"
            sh packaging/tools/smoke.sh vjq "$RUNNER_TEMP/bare/jq"
          fi
          if [ "$STAGED" = true ]; then echo "::notice::npm: staged, not yet approved; run the workflow again with tag $TAG after approving to check the npm install"; exit 0; fi
          p="$RUNNER_TEMP/proj"; mkdir -p "$p"; cd "$p" && npm init -y >/dev/null
          for _ in 1 2 3 4 5 6; do npm install --no-audit --no-fund "$orig@npm:$NPM_SCOPE/$TOOL@$VERSION" && break; sleep 20; done
          sh "$GITHUB_WORKSPACE/packaging/tools/smoke.sh" "$TOOL" "$p/node_modules/.bin/$orig"
      - name: shellcheck/action on the fixture (it must find the issues)
        id: scaction
        if: env.TOOL == 'vsc'
        continue-on-error: true
        uses: ./shellcheck/action
        with:
          version: ${{ needs.plan.outputs.tag }}
          scandir: packaging/tools/fixtures/vsc
          severity: warning
      - name: shellcheck/action's result
        if: env.TOOL == 'vsc'
        env:
          OUTCOME: ${{ steps.scaction.outcome }}
          FILES: ${{ steps.scaction.outputs.files }}
        run: |
          echo "outcome $OUTCOME, files: $FILES"
          [ "$OUTCOME" = failure ] && case "$FILES" in *deploy.sh*lib.bash* | *lib.bash*deploy.sh*) ;; *) false ;; esac
      - name: jq/action
        if: env.TOOL == 'vjq'
        uses: ./jq/action
        with:
          version: ${{ needs.plan.outputs.tag }}
      - name: jq/action's jq
        if: env.TOOL == 'vjq'
        run: |
          command -v jq
          sh packaging/tools/smoke.sh vjq "$(command -v jq)"
