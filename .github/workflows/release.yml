# A v* tag: the compiler and the MCP servers built on each platform, packed as
# vu-<version>-<platform>.tar.gz (vu, compiler/vuc, std/) and mcp-{filesystem,time,fetch,vu,sqlite}-<version>-<platform>.tar.gz,
# and attached to a GitHub release with their SHA-256 sums. install.sh (on vulang.org/install) fetches them.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          if [ "$(uname)" = Linux ]; then sudo apt-get install -y -q libsqlite3-dev >/dev/null; fi
          ./vu version
          compiler/build.sh
          for m in filesystem time fetch vu sqlite; do ./vu build mcp/$m/main.vu -o mcp-$m; done
      - name: Pack
        run: |
          v="${GITHUB_REF_NAME:-dev}"
          d="vu-$v-${{ matrix.platform }}"
          mkdir -p "$d/compiler"
          cp compiler/vuc "$d/compiler/"
          cp -r std "$d/std"
          cp LICENSE* README.md llms.txt "$d/" 2>/dev/null || cp README.md llms.txt "$d/"
          printf '#!/bin/sh\n# The Vu compiler. https://vulang.org\nhere="$(cd "$(dirname "$0")" \&\& pwd)"\nexec "$here/compiler/vuc" "$@"\n' > "$d/vu"
          chmod +x "$d/vu"
          tar czf "$d.tar.gz" "$d"
          files="$d.tar.gz"
          for s in filesystem time fetch vu sqlite; do
            m="mcp-$s-$v-${{ matrix.platform }}"
            mkdir "$m" && cp "mcp-$s" "$m/" && cp "mcp/$s/README.md" "$m/"
            tar czf "$m.tar.gz" "$m"
            files="$files $m.tar.gz"
          done
          if command -v sha256sum >/dev/null; then sha256sum $files > "sums-${{ matrix.platform }}.txt"; else shasum -a 256 $files > "sums-${{ matrix.platform }}.txt"; fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}
          path: |
            *.tar.gz
            sums-*.txt
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat sums-*.txt > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Vu ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md. Install: curl -fsSL https://vulang.org/install | sh" *.tar.gz SHA256SUMS || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *.tar.gz SHA256SUMS
