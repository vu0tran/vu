# A release for each v* tag: the compiler (with the standard library) and the MCP servers for Linux
# x86-64, Linux ARM64 and macOS (Apple silicon), packed by packaging/release.sh as
# vu-<version>-<platform>.tar.gz and mcp-<name>-<version>-<platform>.tar.gz, attached to a GitHub
# release with their SHA-256 sums (SHA256SUMS). install.sh (served at vulang.org/install) installs
# from them, and the release job writes the Homebrew formula (Formula/vu.rb) and commits it to main.
#
# A tag pushed before this workflow existed (or a release to redo): Actions, release, Run workflow,
# with the tag. Run without a tag, it builds and checks the archives and releases nothing.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, e.g. v0.2.0 (empty: build the current main, release nothing)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            march: x86-64-v2
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            march: armv8-a
          - os: macos-15
            platform: macos-arm64
            march: armv8-a
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IS_TAG: ${{ (inputs.tag || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      # the current packaging script, also for a tag made before it existed
      - name: Packaging script
        run: |
          git fetch -q --depth 1 origin main
          git show origin/main:packaging/release.sh > /tmp/release.sh
      - name: Build (Linux, in Ubuntu 22.04 so the binaries run on glibc 2.34 and later)
        if: runner.os == 'Linux'
        run: |
          check=""; [ "$IS_TAG" = true ] && check=1
          v="$TAG"; [ "$IS_TAG" = true ] || v="0.0.0-dev"
          docker run --rm -v "$PWD":/w -v /tmp/release.sh:/release.sh -w /w -e VU_CHECK_VERSION="$check" ubuntu:22.04 sh -c '
            apt-get update -qq >/dev/null &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc libc6-dev libsqlite3-dev libssl-dev ca-certificates >/dev/null &&
            sh /release.sh "$0" "$1" "$2"' "$v" "${{ matrix.platform }}" "${{ matrix.march }}"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          # Vu runs on macOS from 0.3.0 on: the releases before it are Linux only
          case "$TAG" in v0.1.0 | v0.2.0) [ "$IS_TAG" = true ] && { echo "SKIP=1" >> "$GITHUB_ENV"; echo "$TAG predates macOS support"; exit 0; } ;; esac
          [ "$IS_TAG" = true ] && export VU_CHECK_VERSION=1
          v="$TAG"; [ "$IS_TAG" = true ] || v="0.0.0-dev"
          sh /tmp/release.sh "$v" "${{ matrix.platform }}" "${{ matrix.march }}"
      # the archive works where it lands: unpacked elsewhere, through the installer
      - name: Install and run
        if: env.SKIP != '1'
        run: |
          sudo chown -R "$(id -u)" . 2>/dev/null || true
          a=$(ls vu-*-${{ matrix.platform }}.tar.gz)
          v="${a#vu-}"; v="${v%-${{ matrix.platform }}.tar.gz}"
          mkdir -p "/tmp/rel/download/v$v" && cp "$a" "/tmp/rel/download/v$v/"
          (cd "/tmp/rel/download/v$v" && { sha256sum *.tar.gz 2>/dev/null || shasum -a 256 *.tar.gz; } > SHA256SUMS)
          git show origin/main:install.sh > /tmp/install.sh
          VU_RELEASES=file:///tmp/rel VU_VERSION="$v" VU_HOME=/tmp/vuhome VU_BIN=/tmp/vubin sh /tmp/install.sh
          printf 'fn main():\n  print("hello")\n' > /tmp/hello.vu
          test "$(/tmp/vubin/vu run /tmp/hello.vu)" = hello
      - uses: actions/upload-artifact@v5
        if: env.SKIP != '1'
        with:
          name: ${{ matrix.platform }}
          path: |
            *.tar.gz
            sums-*.txt
  release:
    needs: build
    if: inputs.tag || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist
      - name: Release
        run: |
          cd dist
          cat sums-*.txt > SHA256SUMS
          v="${TAG#v}"
          # the notes: this version's paragraph in CHANGELOG.md's Releases, if it has one
          awk -v h="**$v**" 'index($0, h) == 1 { on = 1 } on && /^$/ { exit } on' ../CHANGELOG.md > notes.md
          if ls vu-*-macos-arm64.tar.gz >/dev/null 2>&1; then
            printf '\n## Install\n\n```\ncurl -fsSL https://vulang.org/install | sh\n```\n\nor `brew tap vu0tran/vu https://github.com/vu0tran/vu && brew install vu0tran/vu/vu`. Archives for Linux x86-64, Linux ARM64 (glibc 2.34 or later) and macOS on Apple silicon; check them against SHA256SUMS.\n' >> notes.md
          else
            printf '\n## Install\n\n```\ncurl -fsSL https://vulang.org/install | VU_VERSION=%s sh\n```\n\nArchives for Linux x86-64 and Linux ARM64 (glibc 2.34 or later); this release predates macOS support. Check them against SHA256SUMS.\n' "$v" >> notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber *.tar.gz SHA256SUMS
          else
            gh release create "$TAG" --verify-tag --title "Vu $v" --notes-file notes.md *.tar.gz SHA256SUMS
          fi
      - name: Homebrew formula
        run: |
          v="${TAG#v}"
          # only the newest release goes in the formula
          latest=$(gh release view --json tagName -q .tagName)
          if [ "$latest" != "$TAG" ]; then echo "$TAG isn't the latest release ($latest): the formula stays"; exit 0; fi
          if ! grep -q "vu-$v-macos-arm64.tar.gz" dist/SHA256SUMS; then echo "no macOS archive in $TAG: no formula"; exit 0; fi
          mkdir -p Formula
          sh packaging/homebrew/formula.sh "$v" dist/SHA256SUMS > Formula/vu.rb
          if git diff --quiet -- Formula/vu.rb && git ls-files --error-unmatch Formula/vu.rb >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vu.rb
          git commit -m "Homebrew formula: Vu $v"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
  # what a user does, against the published release: the installer and Homebrew, then a program
  check:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: install.sh
        run: |
          case "$TAG" in v0.1.0 | v0.2.0) [ "$RUNNER_OS" = macOS ] && { echo "$TAG has no macOS release"; exit 0; } ;; esac
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | VU_VERSION="$TAG" sh
          printf 'fn main():\n  print("hello")\n' > /tmp/hello.vu
          test "$("$HOME/.local/bin/vu" run /tmp/hello.vu)" = hello
          test "$("$HOME/.local/bin/vu" version)" = "vu ${TAG#v}"
      - name: Homebrew
        if: runner.os == 'macOS'
        run: |
          f=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/Formula/vu.rb" || true)
          if ! printf '%s\n' "$f" | grep -q "version \"${TAG#v}\""; then echo "the formula isn't for $TAG"; exit 0; fi
          brew tap vu0tran/vu "https://github.com/${{ github.repository }}"
          brew install vu0tran/vu/vu
          brew test vu0tran/vu/vu
          test "$("$(brew --prefix)/bin/vu" version)" = "vu ${TAG#v}"
