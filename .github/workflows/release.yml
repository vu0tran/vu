# A v* tag: the compiler and the MCP filesystem server built on each platform, packed as
# vu-<version>-<platform>.tar.gz (vu, compiler/vuc, std/) and mcp-filesystem-<version>-<platform>.tar.gz,
# and attached to a GitHub release with their SHA-256 sums. install.sh (on vulang.org/install) fetches them.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ./vu version
          compiler/build.sh
          ./vu build mcp/filesystem/main.vu -o mcp-filesystem
      - name: Pack
        run: |
          v="${GITHUB_REF_NAME:-dev}"
          d="vu-$v-${{ matrix.platform }}"
          mkdir -p "$d/compiler"
          cp compiler/vuc "$d/compiler/"
          cp -r std "$d/std"
          cp LICENSE* README.md "$d/" 2>/dev/null || cp README.md "$d/"
          printf '#!/bin/sh\n# The Vu compiler. https://vulang.org\nhere="$(cd "$(dirname "$0")" \&\& pwd)"\nexec "$here/compiler/vuc" "$@"\n' > "$d/vu"
          chmod +x "$d/vu"
          tar czf "$d.tar.gz" "$d"
          m="mcp-filesystem-$v-${{ matrix.platform }}"
          mkdir "$m" && cp mcp-filesystem "$m/" && cp mcp/filesystem/README.md "$m/"
          tar czf "$m.tar.gz" "$m"
          if command -v sha256sum >/dev/null; then sha256sum "$d.tar.gz" "$m.tar.gz" > "sums-${{ matrix.platform }}.txt"; else shasum -a 256 "$d.tar.gz" "$m.tar.gz" > "sums-${{ matrix.platform }}.txt"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            *.tar.gz
            sums-*.txt
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat sums-*.txt > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Vu ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md. Install: curl -fsSL https://vulang.org/install | sh" *.tar.gz SHA256SUMS || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *.tar.gz SHA256SUMS
