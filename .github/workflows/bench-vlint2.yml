# vlint (this branch's build and main's) against oxlint 1.90.0 and 1.79.0 on AFFiNE, on GitHub's
# Linux runner, cold, with and without --type-aware, plus a perf profile of this build's type-aware
# run (bench/vlint_affine.sh). Runs on a push to this branch only.
name: bench-vlint2
on:
  push:
    branches: [bench-vlint2]
permissions:
  contents: read
jobs:
  affine:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: main
          path: old
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: tools (time, perf)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q time
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -q linux-tools-common linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          perf --version || true
          git -C old log -1 --format='old (main): %H %s'
          git log -1 --format='new: %H %s'
      - name: build the new vlint (snapshot, one C file)
        run: |
          python3 ts/jsplug/gen_host.py --from-lhost --snapshot
          ./vu version >/dev/null 2>&1 || true
          cd ts && VU_SPLIT=off ../vu build --release vlint.vu -o "$RUNNER_TEMP/vlint-new"
      - name: build the new vlint again with frame pointers, for perf
        run: |
          printf '#!/bin/sh\nexec gcc "$@" -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -g\n' > "$RUNNER_TEMP/ccfp"
          chmod +x "$RUNNER_TEMP/ccfp"
          cd ts && CC="$RUNNER_TEMP/ccfp" VU_SPLIT=off ../vu build --release vlint.vu -o "$RUNNER_TEMP/vlint-perf"
      - name: build the old vlint (main)
        run: |
          cd old
          ./vu version >/dev/null 2>&1 || true
          cd ts && VU_SPLIT=off ../vu build --release vlint.vu -o "$RUNNER_TEMP/vlint-old"
          ls -l "$RUNNER_TEMP"/vlint-*
      - name: bench
        run: bench/vlint_affine.sh "$RUNNER_TEMP/vlint-new" "$RUNNER_TEMP/vlint-old" "$RUNNER_TEMP/vlint-perf" 2>&1 | tee bench.txt
      - name: summary
        if: always()
        run: |
          cp bench.txt out/ 2>/dev/null || true
          { cat out/runner.txt; echo; cat out/table.md; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          for f in out/*-1.json; do [ -f "$f" ] && gzip -k "$f"; done
          rm -f out/*.json out/*.json.time
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: out
