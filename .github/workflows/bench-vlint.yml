# vlint against oxlint on AFFiNE, on GitHub's 4-core runner (this branch only)
name: bench-vlint
on:
  push:
    branches: [bench-vlint]
jobs:
  affine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build vlint
        run: ./vu version >/dev/null 2>&1 || true; cd ts && VU_SPLIT=off ../vu build --release vlint.vu -o $RUNNER_TEMP/vlint
      - name: bench
        run: bench/vlint_affine.sh $RUNNER_TEMP/vlint 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt
