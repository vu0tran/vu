name: site
# Builds site/Main.dc.html into a Cloudflare Worker and deploys it, on every push to main that changes
# site/ (or by hand from the Actions tab). Needs the repository secret CLOUDFLARE_API_TOKEN: a Cloudflare
# API token from the "Edit Cloudflare Workers" template. Without it the deploy step is skipped.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 site/build.py site/Main.dc.html site/out
      - name: Is there a token?
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::CLOUDFLARE_API_TOKEN isn't set; skipping the deploy"; fi
      - name: Deploy to Cloudflare
        if: steps.token.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
