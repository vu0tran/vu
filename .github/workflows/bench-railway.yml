name: bench-railway
# The URL-shortener benchmark on Railway (bench/railway): deploys the Vu and the Node app, then a
# load generator inside the project's private network, and reports requests/s, latency, memory, CPU
# and monthly cost. Run by hand (Actions > bench-railway > Run workflow).
# Needs a Railway project with a PostgreSQL database named Postgres and three empty services named
# vu, node and loadgen, and that project's token as the repository secret RAILWAY_TOKEN.
on:
  workflow_dispatch:
    inputs:
      seconds: { description: "seconds per run", default: "60" }
      conns: { description: "connections", default: "64" }
jobs:
  bench:
    runs-on: ubuntu-24.04
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the Vu app
        run: ./vu build bench/railway/vu/main.vu -o bench/railway/vu/shortener
      - name: "Railway CLI (5.2.0; 5.3.0 doesn't sign in with project tokens)"
        run: npm install -g @railway/cli@5.2.0
      - name: Configure the services
        run: |
          for s in vu node; do
            railway variables --service $s --set 'DATABASE_URL=${{ '${{' }}Postgres.DATABASE_URL}}' --set PORT=8080 --skip-deploys
          done
          railway variables --service loadgen --set SECONDS_RUN=${{ inputs.seconds }} --set CONNS=${{ inputs.conns }} --skip-deploys
      - name: Deploy the apps
        run: |
          (cd bench/railway/vu && railway up --service vu --detach)
          (cd bench/railway/node && railway up --service node --detach)
      - name: Run the load generator
        run: |
          sleep 90
          cd bench/railway/loadgen && railway up --service loadgen --detach
          for i in $(seq 120); do
            railway logs --service loadgen > ../log.txt 2>&1 || true
            grep -q "BENCH DONE\|BENCH FAILED" ../log.txt && break
            sleep 30
          done
          cat ../log.txt | tail -30
          grep "^RESULT" ../log.txt > ../results.txt
          grep -q "BENCH DONE" ../log.txt
      - name: Memory, CPU and cost
        run: |
          railway status --json > bench/railway/status.json
          python3 bench/railway/metrics.py bench/railway/results.txt bench/railway/status.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: railway-bench, path: "bench/railway/*.txt" }
