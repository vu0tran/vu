# Every push: the compiler built from its seed and the targeted tests run on Linux (x86-64, ARM64) and
# macOS (ARM64), plus the MCP filesystem server against its reference. The full gate (tests/gate.sh)
# stays a local run: it takes about half an hour and needs services (PostgreSQL, TLS certificates).
name: ci
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: GNU timeout on macOS (the test scripts use it)
        if: runner.os == 'macOS'
        run: brew install coreutils && echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build the compiler from the seed
        run: ./vu version
      - name: The compiler rebuilds itself to a fixed point
        run: compiler/build.sh
      - name: Examples
        run: |
          ./vu run examples/binarytrees.vu 12
          ./vu run examples/nbody.vu 1000
          ./vu run --release examples/fannkuch.vu 8
      - name: Targeted tests
        run: |
          tests/run_targeted.sh > targeted.log 2>&1 && ok=1 || ok=0
          tail -3 targeted.log
          # each failure as an annotation (readable through the API, as the log isn't everywhere)
          grep -A2 '^FAIL' targeted.log | grep -v '^--' | head -60 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          [ $ok = 1 ]
      - name: MCP filesystem server against the reference
        if: always()
        run: |
          tests/run_mcp.sh > mcp.log 2>&1 && ok=1 || ok=0
          tail -5 mcp.log
          grep -m5 -A3 'FAIL' mcp.log | cut -c1-900 | while IFS= read -r l; do echo "::error::$l"; done
          [ $ok = 1 ]
