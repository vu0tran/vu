# Every push: the compiler built from its seed and the targeted tests run on Linux (x86-64, ARM64) and
# macOS (ARM64), plus the MCP filesystem server against its reference. The full gate (tests/gate.sh)
# stays a local run: it takes about half an hour and needs services (PostgreSQL, TLS certificates).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler from the seed
        run: ./vu version
      - name: The compiler rebuilds itself to a fixed point
        run: compiler/build.sh
      - name: Examples
        run: |
          ./vu run examples/binarytrees.vu 12
          ./vu run examples/nbody.vu 1000
          ./vu run --release examples/fannkuch.vu 8
      - name: Targeted tests
        run: tests/run_targeted.sh
      - name: MCP filesystem server against the reference
        run: tests/run_mcp.sh
