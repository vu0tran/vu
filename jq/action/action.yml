# Puts vjq (jq 1.7.1 in Vu) on PATH in GitHub Actions as `jq` and `vjq`, in place of
# dcarbone/install-jq-action:
#
#   - uses: vu0tran/vu/jq/action@main      # (or a vjq-vX.Y.Z tag), was: dcarbone/install-jq-action@v3
#   - run: jq --version                    # jq-1.7.1 (vjq reports the version it matches)
#
# It downloads the vjq release for the runner (Linux or macOS, x86-64 or ARM64), checks it against
# the release's SHA256SUMS, and puts its folder first on PATH, so `jq` in later steps is vjq even
# where the runner image has a jq of its own (set use-as-jq: false to get only `vjq`).
name: vjq (jq)
description: Install vjq, jq 1.7.1 written in Vu, as jq
author: vu0tran
branding:
  icon: download
  color: gray-dark
inputs:
  version:
    description: "The vjq release: v0.1.0, vjq-v0.1.0 or latest"
    required: false
    default: latest
  use-as-jq:
    description: Install the jq command too (a link to vjq), ahead of any other jq on PATH
    required: false
    default: "true"
  github-token:
    description: The token for the GitHub API (to find the latest release)
    required: false
    default: ${{ github.token }}
outputs:
  path:
    description: The folder vjq (and jq) were installed in
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - name: Install vjq
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        AS_JQ: ${{ inputs.use-as-jq }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        case "$RUNNER_OS" in Linux | macOS) ;; *) echo "::error::vjq has releases for Linux and macOS only"; exit 1 ;; esac
        bin="$RUNNER_TEMP/vjq-bin"
        flags=(-f)
        if [ "$AS_JQ" != true ]; then flags=(-n); fi
        sh "$GITHUB_ACTION_PATH/../../packaging/tools/install.sh" vjq -b "$bin" "${flags[@]}" "$VERSION"
        echo "$bin" >> "$GITHUB_PATH"
        echo "path=$bin" >> "$GITHUB_OUTPUT"
        "$bin/vjq" --version
