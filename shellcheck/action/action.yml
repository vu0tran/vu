# vsc (ShellCheck 0.11.0 in Vu) in GitHub Actions, in place of ludeeus/action-shellcheck, with its
# inputs, outputs and file discovery:
#
#   - uses: actions/checkout@v5
#   - uses: vu0tran/vu/shellcheck/action@main     # (or a vsc-vX.Y.Z tag), was: ludeeus/action-shellcheck@master
#     with:
#       scandir: ./scripts
#       severity: warning
#       ignore_paths: vendor third_party
#
# It finds the files ludeeus/action-shellcheck finds (shell extensions and rc file names, executable
# files without an extension whose first line is a sh/bash/ksh shebang, and additional_files; not
# in .git, *.go or mvnw, nor in ignore_paths/ignore_names), and runs `shellcheck` on each (or on
# all at once with check_together), with -S severity and --format. The exit code is the last
# failing run's. `version` names a vsc release (the default, latest, is the newest vsc-v* release);
# vsc always checks as ShellCheck 0.11.0 does. SHELLCHECK_OPTS in the job's env is read as by
# ShellCheck. vsc and shellcheck (a link to it) stay on PATH for later steps.
name: vsc (ShellCheck)
description: Run vsc, ShellCheck 0.11.0 written in Vu, with ludeeus/action-shellcheck's inputs
author: vu0tran
branding:
  icon: terminal
  color: gray-dark
inputs:
  additional_files:
    description: A space separated list of additional file names to check
    required: false
    default: ""
  ignore_paths:
    description: Paths to ignore when running ShellCheck (space separated, globs)
    required: false
    default: ""
  ignore_names:
    description: Names to ignore when running ShellCheck (space separated, globs)
    required: false
    default: ""
  severity:
    description: "Minimum severity of errors to consider: error, warning, info, style"
    required: false
    default: ""
  check_together:
    description: Run shellcheck on all files at once, instead of one at a time
    required: false
    default: ""
  scandir:
    description: Directory to be searched for files
    required: false
    default: "."
  format:
    description: Output format (checkstyle, diff, gcc, json, json1, quiet, tty)
    required: false
    default: gcc
  version:
    description: "The vsc release: v0.1.0, vsc-v0.1.0 or latest (ludeeus's `stable` means latest)"
    required: false
    default: latest
  github-token:
    description: The token for the GitHub API (to find the latest release)
    required: false
    default: ${{ github.token }}
outputs:
  files:
    description: The files that were checked
    value: ${{ steps.check.outputs.filepaths }}
  options:
    description: The options used
    value: ${{ steps.check.outputs.options }}
runs:
  using: composite
  steps:
    - name: Install vsc
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        case "$RUNNER_OS" in Linux | macOS) ;; *) echo "::error::vsc has releases for Linux and macOS only"; exit 1 ;; esac
        case "$VERSION" in stable | "") VERSION=latest ;; esac
        bin="$RUNNER_TEMP/vsc-bin"
        sh "$GITHUB_ACTION_PATH/../../packaging/tools/install.sh" vsc -b "$bin" -f "$VERSION"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/shellcheck" --version
    - name: Run the check
      id: check
      shell: bash
      env:
        INPUT_SCANDIR: ${{ inputs.scandir }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_CHECK_TOGETHER: ${{ inputs.check_together }}
        INPUT_IGNORE_PATHS: ${{ inputs.ignore_paths }}
        INPUT_IGNORE_NAMES: ${{ inputs.ignore_names }}
        INPUT_ADDITIONAL_FILES: ${{ inputs.additional_files }}
      run: |
        sc="$RUNNER_TEMP/vsc-bin/shellcheck"
        options=()
        if [[ -n "$INPUT_SEVERITY" ]]; then options+=(-S "$INPUT_SEVERITY"); fi
        options+=("--format=$INPUT_FORMAT")

        set -f   # globs in the inputs go to find, unexpanded
        excludes=('!' -path '*./.git/*' '!' -path '*.go' '!' -path '*/mvnw')
        for path in $INPUT_IGNORE_PATHS; do
          excludes+=('!' -path "*./$path/*" '!' -path "*/$path/*" '!' -path "$path")
        done
        for name in $INPUT_IGNORE_NAMES; do excludes+=('!' -name "$name"); done
        additional=()
        for file in $INPUT_ADDITIONAL_FILES; do additional+=(-o -name "*$file"); done
        set +f

        filepaths=()
        while IFS= read -r -d '' file; do filepaths+=("$file"); done < <(find "$INPUT_SCANDIR" "${excludes[@]}" -type f '(' \
          -name '*.bash' -o -name '.bashrc' -o -name 'bashrc' -o -name '.bash_aliases' -o -name '.bash_completion' \
          -o -name '.bash_login' -o -name '.bash_logout' -o -name '.bash_profile' -o -name 'bash_profile' \
          -o -name '*.ksh' -o -name 'suid_profile' -o -name '*.zsh' -o -name '.zlogin' -o -name 'zlogin' \
          -o -name '.zlogout' -o -name 'zlogout' -o -name '.zprofile' -o -name 'zprofile' -o -name '.zsenv' \
          -o -name 'zsenv' -o -name '.zshrc' -o -name 'zshrc' -o -name '*.sh' -o -path '*/.profile' \
          -o -path '*/profile' -o -name '*.shlib' "${additional[@]}" ')' -print0)
        # executable files without an extension, with a shell's shebang (-perm -u=x...: macOS's find has no -perm /111)
        shebang='^#! */[^ ]*/(env *)?[abk]*sh'
        while IFS= read -r -d '' file; do
          head -n1 "$file" | grep -Eqs "$shebang" || continue
          filepaths+=("$file")
        done < <(find "$INPUT_SCANDIR" "${excludes[@]}" -type f ! -name '*.*' '(' -perm -u=x -o -perm -g=x -o -perm -o=x ')' -print0)

        statuscode=0
        if [[ ${#filepaths[@]} -gt 0 ]]; then
          if [[ -n "$INPUT_CHECK_TOGETHER" ]]; then
            "$sc" "${options[@]}" "${filepaths[@]}" || statuscode=$?
          else
            for file in "${filepaths[@]}"; do "$sc" "${options[@]}" "$file" || statuscode=$?; done
          fi
        fi
        echo "filepaths=${filepaths[*]}" >> "$GITHUB_OUTPUT"
        echo "options=${options[*]}" >> "$GITHUB_OUTPUT"
        exit "$statuscode"
